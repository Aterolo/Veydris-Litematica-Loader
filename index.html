<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veydris Litematica Loader</title>
<meta name="theme-color" content="#100b1d">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#38205c 0,#171024 42%,#08070d 100%);font-family:Inter,system-ui,Arial,sans-serif;color:#f7f1ff}.panel{width:min(92vw,560px);padding:42px 30px;border:1px solid #7547a4;border-radius:22px;background:#100d19eF;box-shadow:0 24px 90px #0009;text-align:center}.mark{font-size:12px;letter-spacing:.35em;color:#c39af5;text-transform:uppercase}.logo{font-size:clamp(38px,9vw,62px);font-weight:900;letter-spacing:.06em;margin:12px 0 4px}.sub{color:#c5b8d6;margin:0 0 30px}.play{width:100%;border:0;border-radius:12px;padding:17px 24px;background:linear-gradient(100deg,#7b36c7,#a45ce5);color:white;font-size:17px;font-weight:800;letter-spacing:.12em;cursor:pointer}.play:hover{filter:brightness(1.12)}.play:disabled{opacity:.55;cursor:wait}.status{min-height:24px;margin:18px 0 0;color:#d4c5e5;font-size:13px}.hint{margin-top:24px;color:#887b98;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main class="panel">
<div class="mark">Eaglercraft 26.2</div>
<div class="logo">VEYDRIS</div>
<p class="sub">Litematica Client Loader</p>
<button class="play" id="play">PLAY</button>
<p class="status" id="status" role="status">Ready to launch</p>
<p class="hint">The loader opens the client in a new tab. Keep this page open until the game has loaded.</p>
</main>
<script>
const CLIENT_URL = new URL("./client.html", location.href);
const play = document.getElementById("play");
const status = document.getElementById("status");
play.addEventListener("click", async () => {
  const gameTab = window.open("about:blank", "_blank");
  if (!gameTab) { status.textContent = "Pop-up blocked. Allow pop-ups and try again."; return; }
  play.disabled = true;
  status.textContent = "Loading client…";
  try {
    const response = await fetch(CLIENT_URL.href, {cache:"no-store"});
    if (!response.ok) throw new Error("client.html was not found in this repository.");
    const source = await response.text();
    const blob = new Blob([source], {type:"text/html;charset=utf-8"});
    const blobUrl = URL.createObjectURL(blob);
    gameTab.location.replace(blobUrl);
    status.textContent = "Client opened in a new tab.";
  } catch (error) {
    gameTab.close();
    status.textContent = error.message || "Could not load client.html.";
    play.disabled = false;
  }
});
</script>
</body>
</html>
